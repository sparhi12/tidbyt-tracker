name: Gemini Issue Handler

on:
  issues:
    types: [opened, labeled]

jobs:
  run-gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Gemini CLI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TERM: xterm-256color
        run: |
          npx -y @google/gemini-cli \
            -m gemini-3.8-flash \
            -p "Read issue #${{ github.event.issue.number }} and summarize the core problem."
