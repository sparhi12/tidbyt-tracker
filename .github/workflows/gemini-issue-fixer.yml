name: Scheduled Gemini Issue Auto-Fixer

on:
  schedule:
    # Runs every 6 hours (adjust cron as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually to test anytime

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scan Open Issues & Generate Fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TERM: xterm-256color
        run: |
          # Fetch all open issue numbers as a JSON list
          ISSUES=$(gh issue list --state open --json number,title,body --limit 5)

          if [ "$ISSUES" = "[]" ] || [ -z "$ISSUES" ]; then
            echo "No open issues found to process."
            exit 0
          fi

          # Process the most recent open issue
          ISSUE_NUM=$(echo "$ISSUES" | jq '.[0].number')
          ISSUE_TITLE=$(echo "$ISSUES" | jq -r '.[0].title')
          ISSUE_BODY=$(echo "$ISSUES" | jq -r '.[0].body')

          echo "Processing Issue #${ISSUE_NUM}: ${ISSUE_TITLE}"

          # 1. Post 'Starting' comment on the Issue
          gh issue comment $ISSUE_NUM --body "🤖 **Gemini Agent update:** I'm scanning this issue and attempting to generate a fix now..."

          # 2. Run Gemini CLI to generate code fixes locally
          npx -y @google/gemini-cli -p "Read Issue #${ISSUE_NUM} (Title: '${ISSUE_TITLE}', Body: '${ISSUE_BODY}'). Inspect the repository files, implement the fix for this issue, and modify the codebase directly." -y --skip-trust

          # 3. Check if Gemini modified any files
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH_NAME="gemini-fix-issue-${ISSUE_NUM}"

            # Create branch & commit changes
            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "fix: automated resolution for issue #${ISSUE_NUM} via Gemini CLI"
            git push origin "$BRANCH_NAME" --force

            # Create Pull Request
            PR_URL=$(gh pr create \
              --title "Fix for Issue #${ISSUE_NUM}: ${ISSUE_TITLE}" \
              --body "Automated fix generated by Gemini CLI for issue #${ISSUE_NUM}." \
              --head "$BRANCH_NAME" \
              --base main)

            # 4. Post comment on the issue with the PR link
            gh issue comment $ISSUE_NUM --body "✅ **Fix ready!** I have submitted a Pull Request with the proposed changes: ${PR_URL}"
          else
            # No files changed by Gemini
            gh issue comment $ISSUE_NUM --body "⚠️ **Notice:** I inspected the repository for this issue but didn't identify any automated code changes to make."
          fi
