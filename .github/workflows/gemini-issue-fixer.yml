name: Scheduled Gemini Issue Auto-Fixer

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scan Open Issues & Generate Fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Grab the first open issue
          ISSUES=$(gh issue list --state open --json number,title,body --limit 1)

          if [ "$ISSUES" = "[]" ] || [ -z "$ISSUES" ]; then
            echo "No open issues found to process."
            exit 0
          fi

          ISSUE_NUM=$(echo "$ISSUES" | jq '.[0].number')
          ISSUE_TITLE=$(echo "$ISSUES" | jq -r '.[0].title')
          ISSUE_BODY=$(echo "$ISSUES" | jq -r '.[0].body')

          echo "Processing Issue #${ISSUE_NUM}: ${ISSUE_TITLE}"

          # 1. Comment on Issue
          gh issue comment $ISSUE_NUM --body "🤖 **Gemini Agent:** Processing issue and generating code fix in a single request..."

          # Rate-limit safety pause before API call
          sleep 5

          # 2. Run Single-Call Python Script
          ISSUE_TITLE="$ISSUE_TITLE" ISSUE_BODY="$ISSUE_BODY" python .github/scripts/fix_issue.py

          # 3. If files were updated, commit & open PR
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH_NAME="gemini-fix-issue-${ISSUE_NUM}"

            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "fix: automated resolution for issue #${ISSUE_NUM}"
            git push origin "$BRANCH_NAME" --force

            PR_URL=$(gh pr create \
              --title "Fix for Issue #${ISSUE_NUM}: ${ISSUE_TITLE}" \
              --body "Automated fix generated by Gemini for issue #${ISSUE_NUM}." \
              --head "$BRANCH_NAME" \
              --base main)

            gh issue comment $ISSUE_NUM --body "✅ **Fix ready!** Pull Request submitted: ${PR_URL}"
          else
            gh issue comment $ISSUE_NUM --body "⚠️ **Notice:** Inspected the issue but no file modifications were generated."
          fi

          # Buffer sleep at the end to keep API usage well under rate limits
          sleep 30
